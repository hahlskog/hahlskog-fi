<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Hahlskog.fi – tapahtumien hallinta</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card login-card" id="login-view">
      <a class="back-link" href="../">← Takaisin sivustolle</a>
      <p class="eyebrow">Hahlskog.fi</p>
      <h1>Tapahtumien hallinta</h1>
      <p class="lead">Kirjaudu Cloudflareen tallennetulla admin-avaimella. Avainta ei tallenneta GitHubiin eikä pysyvästi selaimeen.</p>
      <form id="login-form" class="admin-form">
        <label>Admin-avain
          <input id="token" type="password" placeholder="Syötä ADMIN_TOKEN" autocomplete="current-password" required>
        </label>
        <button class="button" type="submit">Kirjaudu sisään</button>
      </form>
      <div class="notice" id="login-message" hidden></div>
    </section>

    <section class="admin-card panel-card" id="panel-view" hidden>
      <div class="panel-head">
        <div><p class="eyebrow">Hallinta</p><h2 id="form-title">Lisää tapahtuma</h2></div>
        <button class="button button-light" id="logout" type="button">Kirjaudu ulos</button>
      </div>

      <form id="event-form" class="admin-form">
        <input type="hidden" id="event-id">
        <div class="two-col">
          <label>Päivämäärä<input id="date" type="date" required></label>
          <div class="two-col compact">
            <label>Alkaa<input id="startTime" type="time"></label>
            <label>Päättyy<input id="endTime" type="time"></label>
          </div>
        </div>

        <div class="two-col">
          <label>Otsikko FI<input id="titleFi" type="text" required></label>
          <label>Otsikko SV<input id="titleSv" type="text" required></label>
        </div>

        <div class="two-col">
          <label>Paikka FI<input id="placeFi" type="text"></label>
          <label>Paikka SV<input id="placeSv" type="text"></label>
        </div>

        <label>Kuvaus FI<textarea id="descriptionFi" rows="3"></textarea></label>
        <label>Kuvaus SV<textarea id="descriptionSv" rows="3"></textarea></label>
        <label>Lisätietolinkki (valinnainen)<input id="link" type="url" placeholder="https://..."></label>

        <div class="actions">
          <button class="button" id="save-button" type="submit">Julkaise tapahtuma</button>
          <button class="button button-light" id="cancel-edit" type="button" hidden>Peru muokkaus</button>
        </div>
      </form>

      <div class="notice" id="panel-message" hidden></div>

      <hr>
      <div class="panel-head">
        <h2>Tapahtumat</h2>
        <button class="button button-light" id="refresh" type="button">Päivitä</button>
      </div>
      <div id="event-list" class="admin-events">
        <div class="empty">Ladataan tapahtumia…</div>
      </div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
